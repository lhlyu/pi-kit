name: 自动发布

on:
  push:
    branches: [main]
    paths: [package.json]
  # 仅用于重跑同一提交的发布，不改变版本号语义。
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: 发布
    runs-on: ubuntu-latest
    # 只允许从 main 发布，避免 workflow_dispatch 从任意分支推出未合并代码。
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: 检查版本
        id: version
        run: node --experimental-strip-types scripts/verify-release.ts
      - name: 校验发布标签
        if: steps.version.outputs.release == 'true'
        run: node --experimental-strip-types scripts/verify-release-tag.ts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
      - name: 更新 npm
        if: steps.version.outputs.publish == 'true'
        # Trusted Publishing 需要 npm >= 11.5.1。
        run: npm install --global 'npm@^11.5.1' --ignore-scripts
      - name: 安装依赖
        if: steps.version.outputs.publish == 'true'
        run: npm ci --ignore-scripts
      # prepack 自动执行 npm run check，通过后才会上传 TypeScript 源码。
      # 认证只用 Trusted Publishing（OIDC），不保存任何 npm token：
      # 依赖 id-token: write、npm >= 11.5.1，以及 npmjs.com 上把本 workflow 配为
      # Trusted Publisher（首次发布需先手动 npm publish 创建包）。
      - name: 发布 npm
        if: steps.version.outputs.publish == 'true'
        # OIDC 发布会自动生成 provenance；这里显式声明以表明意图。
        run: npm publish --provenance
      - name: 创建发布记录
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --experimental-strip-types scripts/verify-release-tag.ts
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
